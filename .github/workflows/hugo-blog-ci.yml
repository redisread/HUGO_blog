name: HUGO_CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# 防止并发部署冲突
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pinned Hugo and Dart Sass
        run: |
          themes/zzo-dev/scripts/install-tools.sh "$RUNNER_TEMP/zzo-toolchain"
          echo "$RUNNER_TEMP/zzo-toolchain" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/zzo-toolchain/dart-sass" >> "$GITHUB_PATH"

      - name: Build production site
        run: |
          hugo --gc --minify --panicOnWarning
          python3 themes/zzo-dev/scripts/verify-output.py public

      - name: Validate browser behavior
        env:
          ZZO_SITE_DIR: ${{ github.workspace }}/.validation/public
          ZZO_HOME: /
          ZZO_ARTICLE: /20200304/scrapy-exercise/
          ZZO_QUERY: Scrapy
          ZZO_ROUTES: /gallery/,/resume/,/presentation/ue/ue-city/,/tags/scrapy/
        run: |
          hugo --baseURL http://127.0.0.1:4173/ --destination .validation/public --gc --minify --panicOnWarning
          npm ci --prefix themes/zzo-dev
          cd themes/zzo-dev
          npx playwright install --with-deps chromium
          npm test

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: redisread/redisread.github.io
          publish_branch: master
          publish_dir: ./public
          force_orphan: true
